apiVersion: v1
kind: Service
metadata:
  name: autogiro-api
  namespace: autogiro
  labels:
    app: autogiro-api
  annotations:
    # A porta e a do CONTAINER (8000), nao a do Service: o agente Prometheus
    # coleta direto do pod, entao o alvo e o containerPort. Anunciar 80 aqui faz
    # o scrape bater no endpoint do Service, onde nada escuta.
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector:
    app: autogiro-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
# Acesso local:  kubectl -n autogiro port-forward svc/autogiro-api 8000:80
# Exposição externa: via Ingress do Kong (ver ingress.yaml).
