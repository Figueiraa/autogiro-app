# Este arquivo documenta a FORMA do Secret; os valores sao placeholders e nao
# funcionam. A pipeline nao aplica este arquivo: ela cria o Secret com
# `kubectl create secret --from-literal`, lendo os valores dos secrets do
# GitHub Actions, que nunca tocam o repositorio.
#
# Criação manual (desenvolvimento local):
#   kubectl -n autogiro create secret generic autogiro-secret \
#     --from-literal=SECRET_KEY="$JWT_SECRET" \
#     --from-literal=DATABASE_URL="$DATABASE_URL" \
#     --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: autogiro-secret
  namespace: autogiro
type: Opaque
stringData:
  # Mesmo segredo configurado no repositório autogiro-auth: a Lambda assina o
  # token e esta API valida a assinatura.
  SECRET_KEY: "change-me-in-production-with-a-32+-char-secret"
  # Connection string do Neon (driver asyncpg).
  DATABASE_URL: "postgresql+asyncpg://autogiro:senha@ep-xxx.neon.tech/autogiro?ssl=require"
  NEW_RELIC_LICENSE_KEY: "change-me"
