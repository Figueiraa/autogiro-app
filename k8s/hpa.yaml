apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autogiro-api
  namespace: autogiro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autogiro-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
# Requer o metrics-server no cluster (provisionado pelo autogiro-infra-k8s).
